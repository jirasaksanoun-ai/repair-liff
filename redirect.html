<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LINE LIFF Secure Redirector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --bg-color: #040714;
    --neon-blue: #00f2fe;
    --neon-purple: #4facfe;
    --neon-pink: #ff0844;
    --neon-green: #00ff87;
    --glass-bg: rgba(255, 255, 255, 0.02);
    --glass-border: rgba(255, 255, 255, 0.07);
    --text-color: #f1f5f9;
    --text-muted: #64748b;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Sarabun', sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Glowing backgrounds */
  body::before {
    content: '';
    position: absolute;
    top: -10%;
    left: -10%;
    width: 60%;
    height: 60%;
    background: radial-gradient(circle, rgba(0, 242, 254, 0.15) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    filter: blur(80px);
    animation: floatGlow 10s ease-in-out infinite alternate;
  }

  body::after {
    content: '';
    position: absolute;
    bottom: -10%;
    right: -10%;
    width: 50%;
    height: 50%;
    background: radial-gradient(circle, rgba(79, 172, 254, 0.15) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    filter: blur(80px);
    animation: floatGlow2 12s ease-in-out infinite alternate;
  }

  @keyframes floatGlow {
    0% { transform: translate(0, 0); }
    100% { transform: translate(10%, 5%); }
  }
  @keyframes floatGlow2 {
    0% { transform: translate(0, 0); }
    100% { transform: translate(-10%, -5%); }
  }

  /* Main Redirect Card */
  .redirect-container {
    position: relative;
    z-index: 10;
    width: 90%;
    max-width: 420px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 40px 30px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
    text-align: center;
    overflow: hidden;
  }

  .redirect-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 4px;
    background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
  }

  .logo-area {
    margin-bottom: 30px;
    position: relative;
    display: inline-block;
  }

  .icon-glow {
    width: 72px;
    height: 72px;
    background: rgba(0, 242, 254, 0.05);
    border: 1px solid var(--neon-blue);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin: 0 auto;
    box-shadow: 0 0 20px rgba(0, 242, 254, 0.3),
                inset 0 0 10px rgba(0, 242, 254, 0.2);
    animation: iconPulse 2s infinite alternate;
  }

  @keyframes iconPulse {
    0% { box-shadow: 0 0 15px rgba(0, 242, 254, 0.25); transform: scale(1); }
    100% { box-shadow: 0 0 30px rgba(0, 242, 254, 0.6); transform: scale(1.05); }
  }

  h1 {
    font-family: 'Kanit', sans-serif;
    font-size: 1.35rem;
    font-weight: 600;
    background: linear-gradient(135deg, #ffffff 0%, #93c5fd 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 0.82rem;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  /* Neon Spinner */
  .spinner-box {
    position: relative;
    width: 64px;
    height: 64px;
    margin: 0 auto 30px;
  }

  .spinner-ring {
    position: absolute;
    width: 100%;
    height: 100%;
    border: 2px solid transparent;
    border-top: 2px solid var(--neon-blue);
    border-right: 2px solid var(--neon-purple);
    border-radius: 50%;
    animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    filter: drop-shadow(0 0 8px var(--neon-blue));
  }

  .spinner-ring2 {
    position: absolute;
    width: calc(100% - 12px);
    height: calc(100% - 12px);
    top: 6px;
    left: 6px;
    border: 2px solid transparent;
    border-bottom: 2px solid var(--neon-pink);
    border-left: 2px solid var(--neon-purple);
    border-radius: 50%;
    animation: spinReverse 1.5s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    filter: drop-shadow(0 0 8px var(--neon-pink));
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes spinReverse {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(-360deg); }
  }

  /* Status logs */
  .status-text {
    font-family: 'Kanit', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--neon-blue);
    text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
    min-height: 24px;
    margin-bottom: 12px;
  }

  .detail-text {
    font-size: 0.85rem;
    color: var(--text-muted);
    line-height: 1.6;
    max-width: 280px;
    margin: 0 auto;
  }

  /* Fallback buttons */
  .btn-fallback {
    margin-top: 28px;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
    color: #fff;
    font-family: 'Kanit', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0, 242, 254, 0.25);
    transition: all 0.2s;
    display: none;
  }

  .btn-fallback:hover {
    box-shadow: 0 6px 20px rgba(0, 242, 254, 0.45);
    transform: translateY(-1px);
  }
</style>
</head>
<body>

<div class="redirect-container">
  <div class="logo-area">
    <div class="icon-glow">⚡</div>
  </div>

  <h1>LINE LIFF Secure Tunnel</h1>
  <div class="subtitle">Bypassing Sandbox Restrictions</div>

  <div class="spinner-box">
    <div class="spinner-ring"></div>
    <div class="spinner-ring2"></div>
  </div>

  <div class="status-text" id="statusText">Initializing tunnel...</div>
  <div class="detail-text" id="detailText">กรุณารอสักครู่ ระบบกำลังยืนยันสิทธิ์บัญชี LINE ของคุณนอกพื้นที่ควบคุมความปลอดภัย</div>

  <button class="btn-fallback" id="fallbackBtn" onclick="forceRedirect()">เดินทางต่อไปยังเว็บแอปหลัก</button>
</div>

<script>
  // ค่าคอนฟิกหลัก
  const LIFF_ID = '2009669941-oojQ8hNu';
  const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxvTT31CljbM8wIKi2jbm8fhFOUdu9MHKnk23jnOhuKQ7sG_32FCEmu3mLgNPqiH_kp_Q/exec';
  
  let redirectTimeout = null;

  function updateStatus(status, detail, color = '#00f2fe') {
    const sEl = document.getElementById('statusText');
    const dEl = document.getElementById('detailText');
    sEl.textContent = status;
    sEl.style.color = color;
    sEl.style.textShadow = `0 0 10px ${color}66`;
    if (detail) dEl.textContent = detail;
  }

  function showFallbackButton() {
    document.getElementById('fallbackBtn').style.display = 'block';
  }

  function forceRedirect() {
    window.location.href = GAS_WEBAPP_URL;
  }

  async function initLiffRedirector() {
    // กำหนดเวลา Timeout สูงสุด 8 วินาทีให้ปุ่มเดินทางต่อแสดงขึ้นมาเผื่อกรณีมีปัญหาขัดข้อง
    redirectTimeout = setTimeout(() => {
      updateStatus('เชื่อมต่อล่าช้า', 'ไม่สามารถเชื่อมต่อ LINE SDK ได้ทันเวลา คุณสามารถกดปุ่มด้านล่างเพื่อเข้าสู่ระบบแบบปกติได้', '#ff0844');
      showFallbackButton();
    }, 8000);

    try {
      updateStatus('Connecting LINE SDK...', 'กำลังเชื่อมต่อชุดคำสั่ง LINE LIFF...');
      await liff.init({ liffId: LIFF_ID });
      
      updateStatus('Authenticating...', 'กำลังตรวจสอบการลงชื่อเข้าใช้งาน LINE...');
      
      if (!liff.isLoggedIn()) {
        updateStatus('Requesting Login...', 'ระบบกำลังเปลี่ยนเส้นทางไปหน้าเข้าสู่ระบบของ LINE...');
        liff.login();
        return;
      }
      
      updateStatus('Fetching credentials...', 'กำลังถอดรหัสรหัสประจำตัวผู้ใช้งาน (LINE ID)...');
      const profile = await liff.getProfile();
      const userId = profile.userId;
      
      if (userId) {
        clearTimeout(redirectTimeout);
        updateStatus('Redirecting to WebApp...', 'เข้าสู่ระบบผ่านสิทธิ์สำเร็จ กำลังส่งข้อมูลไปยัง Google Workspace...', '#00ff87');
        
        // แนบ uid ไปยัง WebApp หลักบน Google Apps Script
        const targetUrl = `${GAS_WEBAPP_URL}?uid=${userId}`;
        setTimeout(() => {
          window.location.href = targetUrl;
        }, 800);
      } else {
        throw new Error('Could not retrieve User ID');
      }
      
    } catch (err) {
      console.error('LIFF Redirector Error:', err);
      clearTimeout(redirectTimeout);
      updateStatus('Connection Error', 'เกิดข้อผิดพลาดในการดึงข้อมูลสิทธิ์ LINE: ' + err.message, '#ff0844');
      showFallbackButton();
    }
  }

  window.onload = initLiffRedirector;
</script>
</body>
</html>
